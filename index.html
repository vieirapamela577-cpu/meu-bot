<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bot WhatsApp — Pamela Vieira</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

@keyframes aparecer {
  from { opacity:0; transform:translateY(15px) scale(0.95); }
  to { opacity:1; transform:translateY(0) scale(1); }
}
@keyframes pular {
  0%, 60%, 100% { transform:translateY(0); }
  30% { transform:translateY(-6px); }
}
@keyframes brilhar {
  0% { background-position:-200% center; }
  100% { background-position:200% center; }
}
@keyframes pulso {
  0%, 100% { box-shadow:0 0 0 0 rgba(37,211,102,0.5); }
  50% { box-shadow:0 0 0 10px rgba(37,211,102,0); }
}

body {
  font-family:'Inter',system-ui,sans-serif;
  background:linear-gradient(135deg, #0b141a 0%, #1a0b2e 50%, #2d1b4e 100%);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
  position:relative;
  overflow:hidden;
}

body::before {
  content:'';
  position:fixed;
  top:-200px; left:-200px;
  width:600px; height:600px;
  background:radial-gradient(circle, rgba(124,58,237,0.3), transparent 70%);
  border-radius:50%;
  filter:blur(80px);
  animation:brilhar 8s ease-in-out infinite;
}
body::after {
  content:'';
  position:fixed;
  bottom:-200px; right:-200px;
  width:600px; height:600px;
  background:radial-gradient(circle, rgba(236,72,153,0.25), transparent 70%);
  border-radius:50%;
  filter:blur(80px);
  animation:brilhar 10s ease-in-out infinite reverse;
}

.whatsapp {
  width:100%;
  max-width:430px;
  height:92vh;
  max-height:800px;
  background:#111b21;
  border-radius:24px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  box-shadow:0 30px 80px rgba(124,58,237,0.4), 0 0 0 1px rgba(255,255,255,0.05);
  position:relative;
  z-index:2;
  animation:aparecer 0.8s ease;
}

.topo {
  background:linear-gradient(135deg, #202c33, #2a3942);
  padding:16px 20px;
  display:flex;
  align-items:center;
  gap:14px;
  color:white;
  border-bottom:1px solid rgba(255,255,255,0.05);
  position:relative;
  overflow:hidden;
}

.topo::before {
  content:'';
  position:absolute;
  top:0; left:0;
  width:100%; height:2px;
  background:linear-gradient(90deg, #7c3aed, #ec4899, #c9a961, #7c3aed);
  background-size:200% auto;
  animation:brilhar 3s linear infinite;
}

.avatar {
  width:46px; height:46px;
  background:linear-gradient(135deg, #7c3aed, #ec4899);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  flex-shrink:0;
  box-shadow:0 0 20px rgba(124,58,237,0.6);
  position:relative;
}

.avatar::after {
  content:'';
  position:absolute;
  bottom:0; right:0;
  width:12px; height:12px;
  background:#25d366;
  border-radius:50%;
  border:2px solid #202c33;
  animation:pulso 2s infinite;
}

.topo-info { flex:1; }
.topo-info h3 { font-size:16px; font-weight:700; letter-spacing:0.3px; }
.topo-info p { font-size:12px; color:#25d366; display:flex; align-items:center; gap:5px; font-weight:500; }

.chat {
  flex:1;
  overflow-y:auto;
  padding:20px;
  background:#0b141a;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(124,58,237,0.08), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(236,72,153,0.06), transparent 40%);
  scroll-behavior:smooth;
}
.chat::-webkit-scrollbar { width:5px; }
.chat::-webkit-scrollbar-track { background:transparent; }
.chat::-webkit-scrollbar-thumb { background:rgba(124,58,237,0.3); border-radius:10px; }

.msg {
  max-width:82%;
  padding:11px 15px;
  border-radius:12px;
  margin-bottom:10px;
  font-size:14.5px;
  line-height:1.5;
  white-space:pre-line;
  word-wrap:break-word;
  animation:aparecer 0.35s ease;
}
.msg-bot {
  background:linear-gradient(135deg, #202c33, #2a3942);
  color:#e9edef;
  border-top-left-radius:3px;
  box-shadow:0 2px 8px rgba(0,0,0,0.2);
}
.msg-user {
  background:linear-gradient(135deg, #005c4b, #0a7a5e);
  color:#e9edef;
  margin-left:auto;
  border-top-right-radius:3px;
  box-shadow:0 2px 8px rgba(0,92,75,0.3);
}

.opcoes {
  padding:12px 15px;
  background:#202c33;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  border-top:1px solid #2a3942;
}
.opcoes button {
  background:linear-gradient(135deg, #005c4b, #0a7a5e);
  color:white;
  border:none;
  padding:10px 18px;
  border-radius:22px;
  cursor:pointer;
  font-size:13px;
  font-weight:600;
  transition:all 0.3s cubic-bezier(0.22,1,0.36,1);
  font-family:inherit;
  box-shadow:0 3px 10px rgba(0,92,75,0.3);
  position:relative;
  overflow:hidden;
}
.opcoes button::before {
  content:'';
  position:absolute;
  top:0; left:-100%;
  width:100%; height:100%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  transition:left 0.5s;
}
.opcoes button:hover::before { left:100%; }
.opcoes button:hover {
  background:linear-gradient(135deg, #00a884, #00d99e);
  transform:translateY(-2px);
  box-shadow:0 6px 20px rgba(0,168,132,0.5);
}

.input-area {
  padding:12px 15px;
  background:#202c33;
  display:flex;
  gap:10px;
  align-items:center;
}
.input-area input {
  flex:1;
  padding:13px 20px;
  border:none;
  border-radius:25px;
  background:#2a3942;
  color:white;
  font-size:15px;
  font-family:inherit;
  transition:all 0.3s;
}
.input-area input::placeholder { color:#8696a0; }
.input-area input:focus {
  outline:none;
  background:#324048;
  box-shadow:0 0 0 2px rgba(124,58,237,0.3);
}
.input-area button {
  background:linear-gradient(135deg, #00a884, #00d99e);
  border:none;
  width:48px;
  height:48px;
  border-radius:50%;
  cursor:pointer;
  font-size:20px;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all 0.3s cubic-bezier(0.22,1,0.36,1);
  flex-shrink:0;
  box-shadow:0 4px 15px rgba(0,168,132,0.4);
}
.input-area button:hover {
  transform:scale(1.1) rotate(15deg);
  box-shadow:0 6px 25px rgba(0,168,132,0.7);
}

.digitando {
  display:flex;
  gap:5px;
  padding:14px 18px;
  background:linear-gradient(135deg, #202c33, #2a3942);
  border-radius:12px;
  border-top-left-radius:3px;
  width:fit-content;
  margin-bottom:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.2);
  animation:aparecer 0.3s ease;
}
.digitando span {
  width:8px;
  height:8px;
  background:linear-gradient(135deg, #7c3aed, #ec4899);
  border-radius:50%;
  animation:pular 1.4s ease-in-out infinite;
}
.digitando span:nth-child(2) { animation-delay:0.2s; }
.digitando span:nth-child(3) { animation-delay:0.4s; }

@media (max-width:480px) {
  .whatsapp { height:100vh; max-height:100vh; border-radius:0; }
  body { padding:0; }
}
</style>
</head>
<body>

<div class="whatsapp">
  <div class="topo">
    <div class="avatar">🤖</div>
    <div class="topo-info">
      <h3>Pamela Vieira</h3>
      <p>online agora</p>
    </div>
  </div>

  <div class="chat" id="chat"></div>

  <div class="opcoes">
    <button onclick="enviar('Oi')">👋 Oi</button>
    <button onclick="enviar('1')">🌐 Serviços</button>
    <button onclick="enviar('2')">💰 Preços</button>
    <button onclick="enviar('3')">📅 Agendar</button>
    <button onclick="enviar('4')">🙋‍♀️ Atendente</button>
  </div>

  <div class="input-area">
    <input type="text" id="msg-input" placeholder="Digite uma mensagem..."
      onkeypress="if(event.key==='Enter') enviarInput()">
    <button onclick="enviarInput()">➤</button>
  </div>
</div>

<script>
// ===== CONFIGURAÇÃO =====
const WHATSAPP = '5511916348038';
const NOME_NEGOCIO = 'Pamela Vieira';

// ===== FLUXO DE CONVERSA =====
function gerarResposta(msg) {
  msg = msg.trim().toLowerCase();

  // Saudação
  if (['oi','olá','ola','menu','bom dia','boa tarde','boa noite','start'].some(p => msg.includes(p))) {
    return "Olá! 👋 Bem-vindo(a) à *" + NOME_NEGOCIO + "*\n\n" +
      "Sou seu assistente virtual. Posso te ajudar com:\n\n" +
      "1️⃣ *Ver serviços*\n" +
      "2️⃣ *Ver preços*\n" +
      "3️⃣ *Agendar conversa*\n" +
      "4️⃣ *Falar com atendente*\n\n" +
      "Digite o número da opção. 👇";
  }

  // Serviços
  if (msg === '1' || msg.includes('serviço') || msg.includes('servico')) {
    return "🌐 *Nossos Serviços:*\n\n" +
      "• *Site Profissional*\n" +
      "  Sites modernos e que vendem.\n\n" +
      "• *Bot de WhatsApp*\n" +
      "  Atendimento automático 24h.\n\n" +
      "• *Gestão de Redes*\n" +
      "  Instagram profissional.\n\n" +
      "• *Identidade Visual*\n" +
      "  Logo, cores e marca completa.\n\n" +
      "Digite *2* para ver os preços! 💰";
  }

  // Preços
  if (msg === '2' || msg.includes('preço') || msg.includes('preco') || msg.includes('valor')) {
    return "💰 *Tabela de Preços:*\n\n" +
      "🌐 Site Profissional: *R$ 897*\n" +
      "🤖 Bot de WhatsApp: *R$ 697*\n" +
      "🎁 Combo (Site + Bot): *R$ 1.497*\n" +
      "🔧 Manutenção mensal: *R$ 97*\n\n" +
      "💳 Parcelamos em até 3x sem juros\n" +
      "⚡ Entrega em até 7 dias\n\n" +
      "Digite *3* para agendar! 📅";
  }

  // Agendar
  if (msg === '3' || msg.includes('agendar') || msg.includes('agendamento')) {
    return "📅 *Agendar Conversa*\n\n" +
      "Perfeito! Vou te ajudar a agendar uma conversa.\n\n" +
      "Me diga:\n" +
      "• Seu *nome*\n" +
      "• Melhor *horário*\n" +
      "• Qual *serviço* te interessa\n\n" +
      "Ou fale direto: wa.me/" + WHATSAPP;
  }

  // Atendente
  if (msg === '4' || msg.includes('atendente') || msg.includes('humano') || msg.includes('falar')) {
    return "🙋‍♀️ *Transferindo para atendente...*\n\n" +
      "Aguarde um momento, uma atendente vai te responder em breve.\n\n" +
      "📞 (11) 91634-8038\n" +
      "💬 wa.me/" + WHATSAPP;
  }

  // Sobre
  if (msg.includes('sobre') || msg.includes('quem')) {
    return "ℹ️ *Sobre Nós*\n\n" +
      "A *" + NOME_NEGOCIO + "* é especializada em criar sites profissionais e bots de WhatsApp para pequenos negócios.\n\n" +
      "✨ +50 sites entregues\n" +
      "⭐ Avaliação 5 estrelas\n" +
      "🚀 Entrega em até 7 dias\n\n" +
      "Digite *1* para ver os serviços!";
  }

  // Horário
  if (msg.includes('horário') || msg.includes('horario') || msg.includes('funciona')) {
    return "🕐 *Horário de Atendimento*\n\n" +
      "• Seg a Sex: 9h às 18h\n" +
      "• Sábado: 9h às 13h\n" +
      "• Domingo: Fechado\n\n" +
      "Mas pode mandar mensagem a qualquer hora! 😊";
  }

  // Contato
  if (msg.includes('contato') || msg.includes('telefone') || msg.includes('whatsapp')) {
    return "📞 *Nossos Contatos:*\n\n" +
      "• WhatsApp: (11) 91634-8038\n" +
      "• E-mail: contato@pamelavieira.com\n" +
      "• Instagram: @pamelavieira\n\n" +
      "Clique aqui: wa.me/" + WHATSAPP;
  }

  // Agradecimento
  if (msg.includes('obrigad') || msg.includes('valeu') || msg.includes('vlw') || msg.includes('tchau')) {
    return "Foi um prazer te atender! 💜\n\n" +
      "Volte sempre à *" + NOME_NEGOCIO + "*! 🚀";
  }

  // Fallback
  return "Hmm, não entendi muito bem. 😅\n\n" +
    "Tente uma dessas opções:\n\n" +
    "1️⃣ Ver serviços\n" +
    "2️⃣ Ver preços\n" +
    "3️⃣ Agendar conversa\n" +
    "4️⃣ Falar com atendente\n\n" +
    "Ou digite *Oi* para ver o menu completo.";
}

// ===== FUNÇÕES DO CHAT =====
function addMsg(texto, tipo) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = `msg msg-${tipo}`;
  div.textContent = texto;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function mostrarDigitando() {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'digitando';
  div.id = 'digitando';
  div.innerHTML = '<span></span><span></span><span></span>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function removerDigitando() {
  const d = document.getElementById('digitando');
  if (d) d.remove();
}

function enviar(texto) {
  if (!texto.trim()) return;
  addMsg(texto, 'user');
  setTimeout(() => {
    mostrarDigitando();
    setTimeout(() => {
      removerDigitando();
      addMsg(gerarResposta(texto), 'bot');
    }, 900);
  }, 300);
}

function enviarInput() {
  const i = document.getElementById('msg-input');
  enviar(i.value);
  i.value = '';
}

window.onload = () => setTimeout(() => {
  addMsg("Olá! 👋 Bem-vindo(a) à *" + NOME_NEGOCIO + "*\n\nDigite *Oi* ou clique em um botão abaixo para começar.", 'bot');
}, 800);
</script>

</body>
</html>
